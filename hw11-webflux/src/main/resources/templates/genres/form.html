<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="pageTitle">Форма жанра</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/books">Книги</a>
            <a class="nav-link" href="/authors">Авторы</a>
            <a class="nav-link active" href="/genres">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 id="formTitle">Форма жанра</h1>

    <div id="message"></div>

    <form onsubmit="saveGenre(event)" class="mt-4">
        <div class="mb-3">
            <label for="name" class="form-label">Название жанра *</label>
            <input type="text" class="form-control" id="name" required>
        </div>

        <div class="mb-3">
            <button type="submit" id="submitBtn" class="btn btn-success">Сохранить</button>
            <a href="/genres" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const path = window.location.pathname;
        const match = path.match(/\/genres\/edit\/([a-zA-Z0-9-]+)/);
        const genreId = match ? match[1] : null;

        if (genreId) {
            document.getElementById('pageTitle').textContent = 'Редактирование жанра';
            document.getElementById('formTitle').textContent = 'Редактирование жанра';
            document.getElementById('submitBtn').textContent = 'Обновить';
            loadGenre(genreId);
        } else {
            document.getElementById('pageTitle').textContent = 'Добавление жанра';
            document.getElementById('formTitle').textContent = 'Добавление жанра';
            document.getElementById('submitBtn').textContent = 'Создать';
        }
    });

    async function loadGenre(id) {
        try {
            const response = await fetch(`/api/genres/${id}`);
            if (!response.ok) {
                throw new Error('Genre not found');
            }
            const genre = await response.json();
            document.getElementById('name').value = genre.name || '';
        } catch (error) {
            console.error('Error loading genre:', error);
            showMessage('Ошибка загрузки жанра', 'danger');
            setTimeout(() => window.location.href = '/genres', 2000);
        }
    }

    async function saveGenre(event) {
        event.preventDefault();

        const genreData = {
            name: document.getElementById('name').value
        };

        const path = window.location.pathname;
        const match = path.match(/\/genres\/edit\/([a-zA-Z0-9-]+)/);
        const genreId = match ? match[1] : null;

        try {
            let response;
            if (genreId) {
                genreData.id = genreId;
                response = await fetch(`/api/genres/${genreId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(genreData)
                });
            } else {
                response = await fetch('/api/genres', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(genreData)
                });
            }

            if (response.ok) {
                const message = genreId ? 'Жанр успешно обновлен' : 'Жанр успешно создан';
                showMessage(message, 'success');

                setTimeout(() => {
                    window.location.href = '/genres';
                }, 1500);
            } else {
                const error = await response.text();
                showMessage(`Ошибка: ${error}`, 'danger');
            }
        } catch (error) {
            console.error('Error saving genre:', error);
            showMessage('Ошибка сохранения жанра', 'danger');
        }
    }

    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${text}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
    }
</script>
</body>
</html>
