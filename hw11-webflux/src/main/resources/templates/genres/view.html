<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Просмотр жанра - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/books">Книги</a>
            <a class="nav-link" href="/authors">Авторы</a>
            <a class="nav-link active" href="/genres">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Просмотр жанра</h1>
        <div>
            <button onclick="location.href='/genres/edit/' + window.location.pathname.split('/').pop()"
                    class="btn btn-warning me-2">Редактировать</button>
            <button onclick="showDeleteModal()" class="btn btn-danger me-2">Удалить</button>
            <button onclick="location.href='/genres'" class="btn btn-secondary">Назад к списку</button>
        </div>
    </div>

    <div id="messageContainer"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title" id="genreName">Загрузка...</h3>
            <div class="mb-3">
                <strong>ID:</strong> <span id="genreId">...</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0">Книги этого жанра</h5>
        </div>
        <div class="card-body" id="booksContainer">
            <div class="text-muted">Загрузка книг...</div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="deleteModalLabel">⚠️ Подтверждение удаления жанра</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger">
                    <strong>Внимание!</strong> Все книги этого жанра также будут удалены.
                </div>
                <p>Вы уверены, что хотите удалить жанр:</p>
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 id="modalGenreName" class="card-title text-danger"></h6>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" onclick="performDelete()">
                    Да, удалить жанр
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentGenre = null;
    let deleteModal = null;

    document.addEventListener('DOMContentLoaded', function() {
        deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

        const path = window.location.pathname;
        const match = path.match(/\/genres\/([a-zA-Z0-9-]+)/);
        const genreId = match ? match[1] : null;

        if (genreId) {
            loadGenre(genreId);
            loadGenreBooks(genreId);
        } else {
            showMessage('Жанр не найден', 'danger');
            setTimeout(() => window.location.href = '/genres', 2000);
        }
    });

    async function loadGenre(id) {
        try {
            const response = await fetch(`/api/genres/${id}`);
            if (!response.ok) {
                throw new Error('Genre not found');
            }
            currentGenre = await response.json();

            document.getElementById('genreName').textContent = currentGenre.name;
            document.getElementById('genreId').textContent = currentGenre.id;
        } catch (error) {
            console.error('Error loading genre:', error);
            showMessage('Ошибка загрузки жанра', 'danger');
        }
    }

    async function loadGenreBooks(genreId) {
        try {
            const response = await fetch(`/api/genres/${genreId}/books`);
            const books = await response.json();
            const booksContainer = document.getElementById('booksContainer');

            if (!books || books.length === 0) {
                booksContainer.innerHTML = '<div class="text-muted">Книги отсутствуют</div>';
                return;
            }

            booksContainer.innerHTML = '';
            books.forEach(book => {
                const bookDiv = document.createElement('div');
                bookDiv.className = 'mb-3 p-3 border rounded';
                bookDiv.innerHTML = `
                    <h6><a href="/books/${book.id}" class="text-decoration-none">${book.title}</a></h6>
                    <small class="text-muted">ID: ${book.id}</small>
                `;
                booksContainer.appendChild(bookDiv);
            });
        } catch (error) {
            console.error('Error loading books:', error);
            document.getElementById('booksContainer').innerHTML =
                '<div class="text-muted">Не удалось загрузить книги</div>';
        }
    }

    function showDeleteModal() {
        if (!currentGenre) {
            showMessage('Данные жанра не загружены', 'danger');
            return;
        }

        document.getElementById('modalGenreName').textContent = currentGenre.name;
        deleteModal.show();
    }

    async function performDelete() {
        if (!currentGenre) return;

        try {
            const response = await fetch(`/api/genres/${currentGenre.id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showMessage('Жанр успешно удален', 'success');
                deleteModal.hide();

                setTimeout(() => {
                    window.location.href = '/genres';
                }, 1500);
            } else {
                const error = await response.text();
                showMessage(`Ошибка: ${error}`, 'danger');
                deleteModal.hide();
            }
        } catch (error) {
            console.error('Error deleting genre:', error);
            showMessage('Ошибка при удалении жанра', 'danger');
            deleteModal.hide();
        }
    }

    function showMessage(text, type) {
        const container = document.getElementById('messageContainer');
        const alertId = 'alert-' + Date.now();

        container.innerHTML = `
            <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${text}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;

        setTimeout(() => {
            const alertElement = document.getElementById(alertId);
            if (alertElement) {
                const bsAlert = new bootstrap.Alert(alertElement);
                bsAlert.close();
            }
        }, 5000);
    }
</script>
</body>
</html>
