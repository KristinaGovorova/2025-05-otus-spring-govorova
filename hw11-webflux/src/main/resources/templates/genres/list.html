<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Жанры - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .genre-actions {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/books">Книги</a>
            <a class="nav-link" href="/authors">Авторы</a>
            <a class="nav-link active" href="/genres">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Список жанров</h1>
        <a href="/genres/create" class="btn btn-primary">Добавить жанр</a>
    </div>

    <div id="messageContainer"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название жанра</th>
                <th class="genre-actions">Действия</th>
            </tr>
            </thead>
            <tbody id="genresTableBody">
            <tr>
                <td colspan="3" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="deleteModalLabel">⚠️ Подтверждение удаления жанра</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger">
                    <strong>Внимание!</strong> Все книги этого жанра также будут удалены.
                </div>
                <p>Вы уверены, что хотите удалить жанр:</p>
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 id="deleteGenreName" class="card-title text-danger"></h6>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" onclick="performDelete()">
                    Да, удалить жанр
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allGenres = [];
    let currentGenreToDelete = null;
    let deleteModal = null;

    document.addEventListener('DOMContentLoaded', function() {
        deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
        loadGenres();
    });

    async function loadGenres() {
        try {
            const response = await fetch('/api/genres');
            allGenres = await response.json();
            displayGenres(allGenres);
        } catch (error) {
            console.error('Error loading genres:', error);
            showMessage('Ошибка загрузки жанров', 'danger');
        }
    }

    function displayGenres(genres) {
        const tbody = document.getElementById('genresTableBody');

        if (genres.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center text-muted">
                        Жанры не найдены
                    </td>
                </tr>`;
            return;
        }

        tbody.innerHTML = '';
        genres.forEach(genre => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${genre.id}</td>
                <td>
                    <a href="/genres/${genre.id}" class="text-decoration-none">${genre.name}</a>
                </td>
                <td class="genre-actions">
                    <button onclick="location.href='/genres/edit/${genre.id}'"
                            class="btn btn-sm btn-warning me-1">Редактировать</button>
                    <button onclick="showDeleteModal('${genre.id}')"
                            class="btn btn-sm btn-danger">Удалить</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function showDeleteModal(genreId) {
        const genre = allGenres.find(g => g.id === String(genreId));
        if (!genre) {
            showMessage('Жанр не найден', 'danger');
            return;
        }

        currentGenreToDelete = genreId;
        document.getElementById('deleteGenreName').textContent = genre.name;
        deleteModal.show();
    }

    async function performDelete() {
        if (!currentGenreToDelete) return;

        try {
            const response = await fetch(`/api/genres/${currentGenreToDelete}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showMessage('Жанр успешно удален', 'success');
                deleteModal.hide();
                loadGenres();
            } else {
                const error = await response.text();
                showMessage(`Ошибка: ${error}`, 'danger');
                deleteModal.hide();
            }
        } catch (error) {
            console.error('Error deleting genre:', error);
            showMessage('Ошибка при удалении жанра', 'danger');
            deleteModal.hide();
        } finally {
            currentGenreToDelete = null;
        }
    }

    function showMessage(text, type) {
        const container = document.getElementById('messageContainer');
        const alertId = 'alert-' + Date.now();

        container.innerHTML = `
            <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${text}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;

        setTimeout(() => {
            const alertElement = document.getElementById(alertId);
            if (alertElement) {
                const bsAlert = new bootstrap.Alert(alertElement);
                bsAlert.close();
            }
        }, 5000);
    }
</script>
</body>
</html>
