<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="pageTitle">Форма автора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/books">Книги</a>
            <a class="nav-link active" href="/authors">Авторы</a>
            <a class="nav-link" href="/genres">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 id="formTitle">Форма автора</h1>

    <div id="message"></div>

    <form onsubmit="saveAuthor(event)" class="mt-4">
        <div class="mb-3">
            <label for="fullName" class="form-label">Имя автора *</label>
            <input type="text" class="form-control" id="fullName" required>
        </div>

        <div class="mb-3">
            <button type="submit" id="submitBtn" class="btn btn-success">Сохранить</button>
            <a href="/authors" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const path = window.location.pathname;
        const match = path.match(/\/authors\/edit\/(\d+)/);
        const authorId = match ? match[1] : null;

        if (authorId) {
            document.getElementById('pageTitle').textContent = 'Редактирование автора';
            document.getElementById('formTitle').textContent = 'Редактирование автора';
            document.getElementById('submitBtn').textContent = 'Обновить';
            loadAuthor(authorId);
        } else {
            document.getElementById('pageTitle').textContent = 'Добавление автора';
            document.getElementById('formTitle').textContent = 'Добавление автора';
            document.getElementById('submitBtn').textContent = 'Создать';
        }
    });

    async function loadAuthor(id) {
        try {
            const response = await fetch(`/api/authors/${id}`);
            if (!response.ok) {
                throw new Error('Author not found');
            }
            const author = await response.json();
            document.getElementById('fullName').value = author.fullName || '';
        } catch (error) {
            console.error('Error loading author:', error);
            showMessage('Ошибка загрузки автора', 'danger');
            setTimeout(() => window.location.href = '/authors', 2000);
        }
    }

    async function saveAuthor(event) {
        event.preventDefault();

        const authorData = {
            fullName: document.getElementById('fullName').value
        };

        const path = window.location.pathname;
        const match = path.match(/\/authors\/edit\/(\d+)/);
        const authorId = match ? match[1] : null;

        try {
            let response;
            if (authorId) {
                authorData.id = parseInt(authorId);
                response = await fetch(`/api/authors/${authorId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(authorData)
                });
            } else {
                response = await fetch('/api/authors', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(authorData)
                });
            }

            if (response.ok) {
                const message = authorId ? 'Автор успешно обновлен' : 'Автор успешно создан';
                showMessage(message, 'success');

                setTimeout(() => {
                    window.location.href = '/authors';
                }, 1500);
            } else {
                const error = await response.text();
                showMessage(`Ошибка: ${error}`, 'danger');
            }
        } catch (error) {
            console.error('Error saving author:', error);
            showMessage('Ошибка сохранения автора', 'danger');
        }
    }

    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${text}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
    }
</script>
</body>
</html>
