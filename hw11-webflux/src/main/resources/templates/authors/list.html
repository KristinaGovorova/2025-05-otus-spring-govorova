<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Авторы - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .author-actions {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/books">Книги</a>
            <a class="nav-link active" href="/authors">Авторы</a>
            <a class="nav-link" href="/genres">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Список авторов</h1>
        <a href="/authors/create" class="btn btn-primary">Добавить автора</a>
    </div>

    <div id="messageContainer"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя автора</th>
                <th class="author-actions">Действия</th>
            </tr>
            </thead>
            <tbody id="authorsTableBody">
            <tr>
                <td colspan="3" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="deleteModalLabel">⚠️ Подтверждение удаления автора</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger">
                    <strong>Внимание!</strong> Все книги этого автора также будут удалены.
                </div>
                <p>Вы уверены, что хотите удалить автора:</p>
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 id="deleteAuthorName" class="card-title text-danger"></h6>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" onclick="performDelete()">
                    Да, удалить автора
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allAuthors = [];
    let currentAuthorToDelete = null;
    let deleteModal = null;

    document.addEventListener('DOMContentLoaded', function() {
        deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
        loadAuthors();
    });

    async function loadAuthors() {
        try {
            const response = await fetch('/api/authors');
            allAuthors = await response.json();
            displayAuthors(allAuthors);
        } catch (error) {
            console.error('Error loading authors:', error);
            showMessage('Ошибка загрузки авторов', 'danger');
        }
    }

    function displayAuthors(authors) {
        const tbody = document.getElementById('authorsTableBody');

        if (authors.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center text-muted">
                        Авторы не найдены
                    </td>
                </tr>`;
            return;
        }

        tbody.innerHTML = '';
        authors.forEach(author => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${author.id}</td>
                <td>
                    <a href="/authors/${author.id}" class="text-decoration-none">${author.fullName}</a>
                </td>
                <td class="author-actions">
                    <button onclick="location.href='/authors/edit/${author.id}'"
                            class="btn btn-sm btn-warning me-1">Редактировать</button>
                    <button onclick="showDeleteModal(${author.id})"
                            class="btn btn-sm btn-danger">Удалить</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function showDeleteModal(authorId) {
        const author = allAuthors.find(a => a.id == authorId);
        if (!author) {
            showMessage('Автор не найден', 'danger');
            return;
        }

        currentAuthorToDelete = authorId;
        document.getElementById('deleteAuthorName').textContent = author.fullName;
        deleteModal.show();
    }

    async function performDelete() {
        if (!currentAuthorToDelete) return;

        try {
            const response = await fetch(`/api/authors/${currentAuthorToDelete}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showMessage('Автор успешно удален', 'success');
                deleteModal.hide();
                loadAuthors();
            } else {
                const error = await response.text();
                showMessage(`Ошибка: ${error}`, 'danger');
                deleteModal.hide();
            }
        } catch (error) {
            console.error('Error deleting author:', error);
            showMessage('Ошибка при удалении автора', 'danger');
            deleteModal.hide();
        } finally {
            currentAuthorToDelete = null;
        }
    }

    function showMessage(text, type) {
        const container = document.getElementById('messageContainer');
        const alertId = 'alert-' + Date.now();

        container.innerHTML = `
            <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${text}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;

        setTimeout(() => {
            const alertElement = document.getElementById(alertId);
            if (alertElement) {
                const bsAlert = new bootstrap.Alert(alertElement);
                bsAlert.close();
            }
        }, 5000);
    }
</script>
</body>
</html>
