<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="pageTitle">Форма книги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            const match = path.match(/\/books\/edit\/([a-zA-Z0-9-]+)/) || path.match(/\/books\/([a-zA-Z0-9-]+)/);
            const bookId = match ? match[1] : null;

            loadAuthors();
            loadGenres();

            if (bookId) {
                document.getElementById('pageTitle').textContent = 'Редактирование книги';
                document.querySelector('h1').textContent = 'Редактирование книги';
                document.getElementById('submitBtn').textContent = 'Обновить';
                loadBook(bookId);
            } else {
                document.getElementById('pageTitle').textContent = 'Добавление книги';
                document.querySelector('h1').textContent = 'Добавление книги';
                document.getElementById('submitBtn').textContent = 'Создать';
            }
        });

        async function loadBook(id) {
            try {
                const response = await fetch(`/api/books/${id}`);
                if (!response.ok) {
                    throw new Error('Book not found');
                }
                const book = await response.json();

                document.getElementById('title').value = book.title || '';
                document.getElementById('authorId').value = book.authorId || '';
                document.getElementById('genreId').value = book.genreId || '';
            } catch (error) {
                console.error('Error loading book:', error);
                showMessage('Ошибка загрузки книги', 'danger');
                setTimeout(() => window.location.href = '/books', 2000);
            }
        }

        async function loadAuthors() {
            try {
                const response = await fetch('/api/authors');
                const authors = await response.json();
                const select = document.getElementById('authorId');
                select.innerHTML = '<option value="">Выберите автора</option>';
                authors.forEach(author => {
                    select.innerHTML += `<option value="${author.id}">${author.fullName}</option>`;
                });
            } catch (error) {
                console.error('Error loading authors:', error);
            }
        }

        async function loadGenres() {
            try {
                const response = await fetch('/api/genres');
                const genres = await response.json();
                const select = document.getElementById('genreId');
                select.innerHTML = '<option value="">Выберите жанр</option>';
                genres.forEach(genre => {
                    select.innerHTML += `<option value="${genre.id}">${genre.name}</option>`;
                });
            } catch (error) {
                console.error('Error loading genres:', error);
            }
        }

        async function saveBook(event) {
            event.preventDefault();

            const bookData = {
                title: document.getElementById('title').value,
                authorId: document.getElementById('authorId').value,
                genreId: document.getElementById('genreId').value
            };

            const path = window.location.pathname;
            const match = path.match(/\/books\/edit\/([a-zA-Z0-9]+)/);
            const bookId = match ? match[1] : null;

            try {
                let response;
                if (bookId) {
                    bookData.id = bookId;
                    response = await fetch(`/api/books/${bookId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(bookData)
                    });
                } else {
                    response = await fetch('/api/books', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(bookData)
                    });
                }

                if (response.ok) {
                    const message = bookId ? 'Книга успешно обновлена' : 'Книга успешно создана';
                    showMessage(message, 'success');

                    setTimeout(() => {
                        window.location.href = '/books';
                    }, 1500);
                } else {
                    const error = await response.text();
                    showMessage(`Ошибка: ${error}`, 'danger');
                }
            } catch (error) {
                console.error('Error saving book:', error);
                showMessage('Ошибка сохранения книги', 'danger');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${text}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }
    </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/books">Книги</a>
            <a class="nav-link" href="/authors">Авторы</a>
            <a class="nav-link" href="/genres">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Форма книги</h1>

    <div id="message"></div>

    <form onsubmit="saveBook(event)" class="mt-4">
        <div class="mb-3">
            <label for="title" class="form-label">Название книги *</label>
            <input type="text" class="form-control" id="title" required>
        </div>

        <div class="mb-3">
            <label for="authorId" class="form-label">Автор *</label>
            <select class="form-select" id="authorId" required>
                <option value="">Выберите автора</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="genreId" class="form-label">Жанр *</label>
            <select class="form-select" id="genreId" required>
                <option value="">Выберите жанр</option>
            </select>
        </div>

        <div class="mb-3">
            <button type="submit" id="submitBtn" class="btn btn-success">Сохранить</button>
            <a href="/books" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
