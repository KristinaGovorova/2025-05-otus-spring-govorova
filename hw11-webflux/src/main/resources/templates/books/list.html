<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Книги - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .book-actions {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/books">Книги</a>
            <a class="nav-link" href="/authors">Авторы</a>
            <a class="nav-link" href="/genres">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Список книг</h1>
        <a href="/books/create" class="btn btn-primary">Добавить книгу</a>
    </div>

    <!-- Контейнер для сообщений -->
    <div id="messageContainer"></div>

    <!-- Фильтры -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Фильтры</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="authorFilter" class="form-label">Автор</label>
                    <select id="authorFilter" class="form-select">
                        <option value="">Все авторы</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="genreFilter" class="form-label">Жанр</label>
                    <select id="genreFilter" class="form-select">
                        <option value="">Все жанры</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button onclick="applyFilters()" class="btn btn-outline-secondary w-100">
                        Применить фильтры
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Таблица книг -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Автор</th>
                <th>Жанр</th>
                <th class="book-actions">Действия</th>
            </tr>
            </thead>
            <tbody id="booksTableBody">
            <!-- Данные загружаются через JavaScript -->
            <tr>
                <td colspan="5" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно подтверждения удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="deleteModalLabel">⚠️ Подтверждение удаления</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger">
                    <strong>Внимание!</strong> Это действие невозможно отменить.
                </div>
                <p>Вы уверены, что хотите удалить книгу:</p>
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 id="deleteBookTitle" class="card-title text-danger"></h6>
                        <p class="mb-1"><strong>Автор:</strong> <span id="deleteBookAuthor"></span></p>
                        <p class="mb-0"><strong>Жанр:</strong> <span id="deleteBookGenre"></span></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" onclick="performDelete()">
                    Да, удалить книгу
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allBooks = [];
    let allAuthors = [];
    let allGenres = [];
    let currentBookToDelete = null;
    let deleteModal = null;

    document.addEventListener('DOMContentLoaded', function() {
        deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

        loadBooks();
        loadAuthorsForFilter();
        loadGenresForFilter();
    });

    async function loadBooks() {
        try {
            const response = await fetch('/api/books');
            allBooks = await response.json();
            displayBooks(allBooks);
        } catch (error) {
            console.error('Error loading books:', error);
            showMessage('Ошибка загрузки книг', 'danger');
        }
    }

    async function loadAuthorsForFilter() {
        try {
            const response = await fetch('/api/authors');
            allAuthors = await response.json();
            const authorSelect = document.getElementById('authorFilter');
            authorSelect.innerHTML = '<option value="">Все авторы</option>';
            allAuthors.forEach(author => {
                authorSelect.innerHTML += `<option value="${author.id}">${author.fullName}</option>`;
            });
        } catch (error) {
            console.error('Error loading authors:', error);
        }
    }

    async function loadGenresForFilter() {
        try {
            const response = await fetch('/api/genres');
            allGenres = await response.json();
            const genreSelect = document.getElementById('genreFilter');
            genreSelect.innerHTML = '<option value="">Все жанры</option>';
            allGenres.forEach(genre => {
                genreSelect.innerHTML += `<option value="${genre.id}">${genre.name}</option>`;
            });
        } catch (error) {
            console.error('Error loading genres:', error);
        }
    }

    function displayBooks(books) {
        const tbody = document.getElementById('booksTableBody');

        if (books.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted">
                        Книги не найдены
                    </td>
                </tr>`;
            return;
        }

        tbody.innerHTML = '';
        books.forEach(book => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${book.id}</td>
                <td>
                    <a href="/books/${book.id}" class="text-decoration-none">${book.title}</a>
                </td>
                <td>${book.authorName || 'Не указан'}</td>
                <td>${book.genreName || 'Не указан'}</td>
                <td class="book-actions">
                    <button onclick="location.href='/books/edit/${book.id}'"
                            class="btn btn-sm btn-warning me-1">Редактировать</button>
                    <button onclick="showDeleteModal('${book.id}')"
                            class="btn btn-sm btn-danger">Удалить</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function applyFilters() {
        const authorId = document.getElementById('authorFilter').value;
        const genreId = document.getElementById('genreFilter').value;

        let filtered = allBooks;

        if (authorId) {
            filtered = filtered.filter(book => book.authorId == authorId);
        }

        if (genreId) {
            filtered = filtered.filter(book => book.genreId == genreId);
        }

        displayBooks(filtered);
    }

    function showDeleteModal(bookId) {
        const book = allBooks.find(b => b.id === String(bookId));
        if (!book) {
            showMessage('Книга не найдена', 'danger');
            return;
        }

        currentBookToDelete = bookId;

        document.getElementById('deleteBookTitle').textContent = book.title;
        document.getElementById('deleteBookAuthor').textContent = book.authorName || 'Не указан';
        document.getElementById('deleteBookGenre').textContent = book.genreName || 'Не указан';

        deleteModal.show();
    }

    async function performDelete() {
        if (!currentBookToDelete) return;

        try {
            const response = await fetch(`/api/books/${currentBookToDelete}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showMessage('Книга успешно удалена', 'success');
                deleteModal.hide();
                loadBooks();
            } else {
                const error = await response.text();
                showMessage(`Ошибка: ${error}`, 'danger');
                deleteModal.hide();
            }
        } catch (error) {
            console.error('Error deleting book:', error);
            showMessage('Ошибка при удалении книги', 'danger');
            deleteModal.hide();
        } finally {
            currentBookToDelete = null;
        }
    }

    function showMessage(text, type) {
        const container = document.getElementById('messageContainer');
        const alertId = 'alert-' + Date.now();

        container.innerHTML = `
            <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${text}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        ` + container.innerHTML;

        setTimeout(() => {
            const alertElement = document.getElementById(alertId);
            if (alertElement) {
                const bsAlert = new bootstrap.Alert(alertElement);
                bsAlert.close();
            }
        }, 5000);
    }

    document.getElementById('deleteModal').addEventListener('hidden.bs.modal', function () {
        currentBookToDelete = null;
    });
</script>
</body>
</html>
