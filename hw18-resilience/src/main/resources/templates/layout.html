<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Библиотека'">Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Книги</a>
            <a class="nav-link" th:href="@{/authors}">Авторы</a>
            <a class="nav-link" th:href="@{/genres}">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 th:text="${title}"></h1>
    <div th:insert="${content}"></div>
</div>

<footer class="bg-light text-center py-3 mt-5">
    <div class="container">
        <span class="text-muted">© 2024 Библиотека</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
