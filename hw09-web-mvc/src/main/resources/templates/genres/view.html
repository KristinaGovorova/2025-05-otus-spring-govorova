<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Жанр - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Книги</a>
            <a class="nav-link" th:href="@{/authors}">Авторы</a>
            <a class="nav-link" th:href="@{/genres}">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Жанр: <span th:text="${genre.name}"></span></h1>
        <div>
            <a th:href="@{/genres/edit/{id}(id=${genre.id})}" class="btn btn-warning">Редактировать</a>
            <a th:href="@{/genres}" class="btn btn-secondary">Назад к списку</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${genre.name}">Название жанра</h5>
            <div class="mb-3">
                <strong>ID:</strong> <span th:text="${genre.id}">1</span>
            </div>
            <div class="mb-3">
                <strong>Количество книг:</strong>
                <span th:text="${books.size()}">0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0">Книги в этом жанре</h5>
        </div>
        <div class="card-body">
            <div th:if="${books == null or books.size() == 0}" class="text-muted">
                В этом жанре пока нет книг
            </div>

            <div th:if="${books != null and books.size() > 0}">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Автор</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}">1</td>
                        <td>
                            <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Название книги</a>
                        </td>
                        <td>
                            <span th:if="${book.author != null}" th:text="${book.author.fullName}">Автор</span>
                            <span th:if="${book.author == null}" class="text-muted">Не указан</span>
                        </td>
                        <td>
                            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                            <a th:href="@{/books/delete-confirm/{id}(id=${book.id})}" class="btn btn-sm btn-danger">
                                Удалить
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
