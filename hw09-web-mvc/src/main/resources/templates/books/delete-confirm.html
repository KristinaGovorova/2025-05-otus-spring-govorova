<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение удаления книги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Книги</a>
            <a class="nav-link" th:href="@{/authors}">Авторы</a>
            <a class="nav-link" th:href="@{/genres}">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card border-warning">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">⚠️ Подтверждение удаления книги</h4>
        </div>
        <div class="card-body">
            <h5>Вы пытаетесь удалить книгу: <span th:text="${book.title}" class="text-danger"></span></h5>

            <div class="alert alert-danger mt-3">
                <strong>Внимание!</strong> Это действие невозможно отменить. Книга будет безвозвратно удалена.
            </div>

            <div class="card mb-3">
                <div class="card-body">
                    <h6>Информация о книге:</h6>
                    <p><strong>Название:</strong> <span th:text="${book.title}"></span></p>
                    <p><strong>Автор:</strong>
                        <span th:if="${book.author != null}" th:text="${book.author.fullName}"></span>
                        <span th:if="${book.author == null}" class="text-muted">Не указан</span>
                    </p>
                    <p><strong>Жанр:</strong>
                        <span th:if="${book.genre != null}" th:text="${book.genre.name}"></span>
                        <span th:if="${book.genre == null}" class="text-muted">Не указан</span>
                    </p>
                </div>
            </div>

            <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post" class="mt-4">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Да, удалить книгу</button>
                    <a th:href="@{/books}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
