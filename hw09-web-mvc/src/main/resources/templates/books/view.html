<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Просмотр книги - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Книги</a>
            <a class="nav-link" th:href="@{/authors}">Авторы</a>
            <a class="nav-link" th:href="@{/genres}">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Просмотр книги</h1>
        <div>
            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning">Редактировать</a>
            <a th:href="@{/books}" class="btn btn-secondary">Назад к списку</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${book.title}">Название книги</h5>
            <div class="mb-3">
                <strong>ID:</strong> <span th:text="${book.id}">1</span>
            </div>
            <div class="mb-3">
                <strong>Автор:</strong>
                <span th:if="${book.author != null}" th:text="${book.author.fullName}">Автор</span>
                <span th:if="${book.author == null}" class="text-muted">Не указан</span>
            </div>
            <div class="mb-3">
                <strong>Жанр:</strong>
                <span th:if="${book.genre != null}" th:text="${book.genre.name}">Жанр</span>
                <span th:if="${book.genre == null}" class="text-muted">Не указан</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0">Комментарии</h5>
        </div>
        <div class="card-body">
            <div th:if="${book.comments == null or book.comments.size() == 0}" class="text-muted">
                Комментарии отсутствуют
            </div>
            <div th:if="${book.comments != null and book.comments.size() > 0}">
                <div th:each="comment : ${book.comments}" class="mb-3 p-3 border rounded">
                    <p th:text="${comment.text}">Текст комментария</p>
                    <small class="text-muted">ID: <span th:text="${comment.id}"></span></small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
