<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Книги - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Книги</a>
            <a class="nav-link" th:href="@{/authors}">Авторы</a>
            <a class="nav-link" th:href="@{/genres}">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Список книг</h1>
        <a th:href="@{/books/create}" class="btn btn-primary">Добавить книгу</a>
    </div>

    <div th:if="${books == null or books.size() == 0}" class="alert alert-info">
        Книги не найдены
    </div>

    <table th:if="${books != null and books.size() > 0}" class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Автор</th>
            <th>Жанр</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td>
                <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Название книги</a>
            </td>
            <td>
                <span th:if="${book.author != null}" th:text="${book.author.fullName}">Автор</span>
                <span th:if="${book.author == null}" class="text-muted">Не указан</span>
            </td>
            <td>
                <span th:if="${book.genre != null}" th:text="${book.genre.name}">Жанр</span>
                <span th:if="${book.genre == null}" class="text-muted">Не указан</span>
            </td>
            <td>
                <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                <a th:href="@{/books/delete-confirm/{id}(id=${book.id})}" class="btn btn-sm btn-danger">
                    Удалить
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
