<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Жанры - Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Книги</a>
            <a class="nav-link" th:href="@{/authors}">Авторы</a>
            <a class="nav-link" th:href="@{/genres}">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Список жанров</h1>
        <a th:href="@{/genres/create}" class="btn btn-primary">Добавить жанр</a>
    </div>

    <div th:if="${genres == null or genres.size() == 0}" class="alert alert-info">
        Жанры не найдены
    </div>

    <table th:if="${genres != null and genres.size() > 0}" class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="genre : ${genres}">
            <td th:text="${genre.id}">1</td>
            <td>
                <a th:href="@{/genres/{id}(id=${genre.id})}" th:text="${genre.name}">Название жанра</a>
            </td>
            <td>
                <a th:href="@{/genres/edit/{id}(id=${genre.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                <a th:href="@{/genres/delete-confirm/{id}(id=${genre.id})}" class="btn btn-sm btn-danger">
                    Удалить
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
