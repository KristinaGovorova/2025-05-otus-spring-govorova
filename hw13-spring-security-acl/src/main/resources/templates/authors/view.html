<!DOCTYPE html>
<html th:replace="~{layout :: template(~{:: .view-content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>

<div class="view-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
        </div>
        <div>
            <a th:href="@{/authors/edit/{id}(id=${author.id})}" class="btn btn-warning">Редактировать</a>
            <a th:href="@{/authors}" class="btn btn-outline-secondary">Назад к списку</a>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
            <h4 class="card-title mb-0" th:text="${author.fullName}">Имя автора</h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <strong class="text-muted">ID:</strong>
                        <span th:text="${author.id}" class="ms-2">1</span>
                    </div>
                    <div class="mb-3">
                        <strong class="text-muted">Количество книг:</strong>
                        <span th:text="${books.size()}" class="ms-2">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="card-title mb-0">Книги автора</h5>
        </div>
        <div class="card-body">
            <div th:if="${books == null or books.size() == 0}" class="text-muted text-center py-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-book" viewBox="0 0 16 16">
                    <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z"/>
                </svg>
                <p class="mt-2 mb-0">У автора пока нет книг в библиотеке</p>
            </div>

            <div th:if="${books != null and books.size() > 0}">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Жанр</th>
                            <th>Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}">1</td>
                            <td>
                                <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}" class="text-decoration-none">
                                    Название книги
                                </a>
                            </td>
                            <td>
                                <span th:if="${book.genre != null}" th:text="${book.genre.name}">Жанр</span>
                                <span th:if="${book.genre == null}" class="text-muted">Не указан</span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-outline-warning">
                                        Редактировать
                                    </a>
                                    <a th:href="@{/books/delete-confirm/{id}(id=${book.id})}" class="btn btn-outline-danger">
                                        Удалить
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
