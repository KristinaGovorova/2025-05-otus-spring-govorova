<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.id != null} ? 'Редактирование книги' : 'Добавление книги'">Форма книги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Книги</a>
            <a class="nav-link" th:href="@{/authors}">Авторы</a>
            <a class="nav-link" th:href="@{/genres}">Жанры</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 th:text="${book.id != null} ? 'Редактирование книги' : 'Добавление книги'">Форма книги</h1>

    <div th:if="${param.error}" class="alert alert-danger">
        Произошла ошибка при сохранении
    </div>

    <form th:action="@{/books/{action}(action=${book.id != null ? 'edit/' + book.id : 'create'})}"
          method="post" class="mt-4">

        <div class="mb-3">
            <label for="title" class="form-label">Название книги *</label>
            <input type="text" class="form-control" id="title" name="title"
                   th:value="${book.title}" required minlength="1" maxlength="255">
        </div>

        <div class="mb-3">
            <label for="authorId" class="form-label">Автор *</label>
            <select class="form-select" id="authorId" name="authorId" required>
                <option value="">Выберите автора</option>
                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.fullName}"
                        th:selected="${book.author != null and book.author.id == author.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="genreId" class="form-label">Жанр *</label>
            <select class="form-select" id="genreId" name="genreId" required>
                <option value="">Выберите жанр</option>
                <option th:each="genre : ${genres}"
                        th:value="${genre.id}"
                        th:text="${genre.name}"
                        th:selected="${book.genre != null and book.genre.id == genre.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <button type="submit" class="btn btn-success">
                <span th:text="${book.id != null} ? 'Обновить' : 'Создать'"></span>
            </button>
            <a th:href="@{/books}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
