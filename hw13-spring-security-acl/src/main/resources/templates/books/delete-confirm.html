<!DOCTYPE html>
<html th:replace="~{layout :: template(~{:: .delete-content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>

<div class="delete-content">

    <div class="card border-warning shadow-sm">
        <div class="card-header bg-warning text-dark d-flex align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <h4 class="mb-0">Подтверждение удаления</h4>
        </div>

        <div class="card-body">
            <h5>Вы собираетесь удалить книгу: <strong th:text="${book.title}">Название</strong></h5>

            <div class="alert alert-danger mt-3">
                <strong>Внимание!</strong> Это действие невозможно отменить.
            </div>

            <div class="card bg-light mb-4">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">Детали:</h6>
                    <p class="mb-1"><strong>ID:</strong> <span th:text="${book.id}"></span></p>
                    <p class="mb-1"><strong>Автор:</strong>
                        <span th:if="${book.author != null}" th:text="${book.author.fullName}"></span>
                    </p>
                    <p class="mb-0"><strong>Жанр:</strong>
                        <span th:if="${book.genre != null}" th:text="${book.genre.name}"></span>
                    </p>
                </div>
            </div>

            <form th:action="@{/books/delete/{id}(id=${book.id})}" method="post">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger btn-lg">
                        Да, удалить
                    </button>
                    <a th:href="@{/books}" class="btn btn-secondary btn-lg">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
