<!DOCTYPE html>
<html th:fragment="template(content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Библиотека'">Библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .user-info { line-height: 1.2; text-align: right; margin-right: 15px; }
        .user-role { font-size: 0.75rem; color: #adb5bd; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Библиотека</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <div class="navbar-nav me-auto mb-2 mb-lg-0">
                <a class="nav-link" th:href="@{/books}">Книги</a>
                <a class="nav-link" th:href="@{/authors}">Авторы</a>
                <a class="nav-link" th:href="@{/genres}">Жанры</a>
            </div>

            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <div class="user-info text-white">
                    <div class="fw-bold"><span sec:authentication="name">User</span></div>
                    <div class="user-role"><span sec:authentication="principal.authorities">Roles</span></div>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            </div>

            <div class="d-flex" sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-primary btn-sm">Войти</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 th:if="${title}" th:text="${title}"></h1>
    <div th:replace="${content}"></div>
</div>

<footer class="bg-light text-center py-3 mt-5">
    <div class="container"><span class="text-muted">© 2025 Библиотека</span></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
