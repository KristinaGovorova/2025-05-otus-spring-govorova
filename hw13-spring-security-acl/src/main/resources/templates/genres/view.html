<!DOCTYPE html>
<html th:replace="~{layout :: template(~{:: .view-content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>

<div class="view-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
        </div>
        <div>
            <a th:href="@{/genres/edit/{id}(id=${genre.id})}" class="btn btn-warning">Редактировать</a>
            <a th:href="@{/genres}" class="btn btn-outline-secondary">Назад к списку</a>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
            <h4 class="card-title mb-0" th:text="${genre.name}">Название жанра</h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <strong class="text-muted">ID:</strong>
                        <span th:text="${genre.id}" class="ms-2">1</span>
                    </div>
                    <div class="mb-3">
                        <strong class="text-muted">Количество книг:</strong>
                        <span th:text="${books.size()}" class="ms-2">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-light">
            <h5 class="card-title mb-0">Книги в этом жанре</h5>
        </div>
        <div class="card-body">
            <div th:if="${books == null or books.size() == 0}" class="text-muted text-center py-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-bookmarks" viewBox="0 0 16 16">
                    <path d="M2 4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v11.5a.5.5 0 0 1-.777.416L7 13.101l-4.223 2.815A.5.5 0 0 1 2 15.5V4zm2-1a1 1 0 0 0-1 1v10.566l3.723-2.482a.5.5 0 0 1 .554 0L11 14.566V4a1 1 0 0 0-1-1H4z"/>
                    <path d="M4.268 1H12a1 1 0 0 1 1 1v11.768l.223.148A.5.5 0 0 0 14 13.5V2a2 2 0 0 0-2-2H6a2 2 0 0 0-1.732 1z"/>
                </svg>
                <p class="mt-2 mb-0">В этом жанре пока нет книг</p>
            </div>

            <div th:if="${books != null and books.size() > 0}">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Автор</th>
                            <th>Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}">1</td>
                            <td>
                                <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}" class="text-decoration-none">
                                    Название книги
                                </a>
                            </td>
                            <td>
                                <span th:if="${book.author != null}" th:text="${book.author.fullName}">Автор</span>
                                <span th:if="${book.author == null}" class="text-muted">Не указан</span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm" role="group">
                                    <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-outline-warning">
                                        Редактировать
                                    </a>
                                    <a th:href="@{/books/delete-confirm/{id}(id=${book.id})}" class="btn btn-outline-danger">
                                        Удалить
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
