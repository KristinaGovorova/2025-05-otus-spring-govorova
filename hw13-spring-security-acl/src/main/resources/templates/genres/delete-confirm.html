<!DOCTYPE html>
<html th:replace="~{layout :: template(~{:: .delete-content})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div class="delete-content">

    <div class="card border-warning shadow-sm">
        <div class="card-header bg-warning text-dark d-flex align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <h4 class="mb-0">Подтверждение удаления</h4>
        </div>

        <div class="card-body">
            <h5>Вы собираетесь удалить жанр: <strong th:text="${genre.name}"></strong></h5>

            <div class="alert alert-danger mt-3">
                <strong>Внимание!</strong> В этом жанре есть книги в библиотеке.
                Если вы удалите жанр, эти книги станут недоступны.
            </div>

            <div th:if="${books != null and books.size() > 0}" class="card bg-light mb-4">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">
                        Книги в этом жанре (<span th:text="${books.size()}"></span>):
                    </h6>
                    <ul class="list-group list-group-flush">
                        <li th:each="book : ${books}" class="list-group-item bg-transparent px-0">
                            <strong th:text="${book.title}"></strong>
                            <span th:if="${book.author != null}" class="text-muted">
                                (Автор: <span th:text="${book.author.fullName}"></span>)
                            </span>
                        </li>
                    </ul>
                </div>
            </div>

            <form th:action="@{/genres/delete/{id}(id=${genre.id})}" method="post">
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="deleteBooks" name="deleteBooks"
                           value="true" onchange="toggleDeleteButton()">
                    <label class="form-check-label text-danger" for="deleteBooks">
                        <strong>Да, я понимаю последствия и хочу удалить жанр и все книги в этом жанре</strong>
                    </label>
                    <div class="form-text">
                        Это действие невозможно отменить. Все книги в этом жанре будут безвозвратно удалены.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" id="deleteButton" class="btn btn-secondary" disabled>
                        Подтвердить удаление
                    </button>
                    <a th:href="@{/genres}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        function toggleDeleteButton() {
            const checkbox = document.getElementById('deleteBooks');
            const deleteButton = document.getElementById('deleteButton');

            if (checkbox && deleteButton) {
                if (checkbox.checked) {
                    deleteButton.disabled = false;
                    deleteButton.classList.remove('btn-secondary');
                    deleteButton.classList.add('btn-danger');
                } else {
                    deleteButton.disabled = true;
                    deleteButton.classList.remove('btn-danger');
                    deleteButton.classList.add('btn-secondary');
                }
            }
        }
        toggleDeleteButton();
    </script>
</div>

</body>
</html>
