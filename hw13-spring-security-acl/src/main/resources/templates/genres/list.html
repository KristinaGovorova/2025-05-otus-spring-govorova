<!DOCTYPE html>
<html th:replace="~{layout :: template(~{:: .genre-content})}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div class="genre-content">

    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/genres/create}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Добавить жанр
        </a>
    </div>

    <div th:if="${genres == null or genres.size() == 0}" class="alert alert-info">
        Жанры не найдены
    </div>

    <table th:if="${genres != null and genres.size() > 0}" class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="genre : ${genres}">
            <td th:text="${genre.id}">1</td>
            <td>
                <a th:href="@{/genres/{id}(id=${genre.id})}" th:text="${genre.name}">Название жанра</a>
            </td>
            <td>
                <a th:href="@{/genres/edit/{id}(id=${genre.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                <a th:href="@{/genres/delete-confirm/{id}(id=${genre.id})}" class="btn btn-sm btn-danger">
                    Удалить
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
