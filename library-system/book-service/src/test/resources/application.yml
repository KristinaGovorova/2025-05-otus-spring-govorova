spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true # для data.sql
  sql:
    init:
      mode: always
  main:
    allow-bean-definition-overriding: true # для ACL конфига
  shell:
    interactive:
       enabled: false